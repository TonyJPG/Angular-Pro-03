<h1>GitHub Issues</h1>

<div class="my-5 border-b-2 border-blue-600"></div>

<section class="grid grid-cols-1 sm:grid-cols-3 gap-2">
  <!-- botones para controlar el estado (state) -->
  <div class="col-span-3 flex flex-col">
    <div class="flex gap-2">
      <button
        [class.active]="currentState() === state.All"
        class="btn"
        (click)="onChangeState(state.All)"
      >
        All
      </button>
      <button
        [class.active]="currentState() === state.Open"
        class="btn"
        (click)="onChangeState(state.Open)"
      >
        Open
      </button>
      <button
        [class.active]="currentState() === state.Closed"
        class="btn"
        (click)="onChangeState(state.Closed)"
      >
        Closed
      </button>
    </div>
  </div>

  <!-- listado -->
  <div class="mt-4 flex flex-col col-span-2">
    @for (issue of issuesQuery.data(); track issue.id) {
      <issue-item [issue]="issue" />
    } @empty {
      @if (issuesQuery.isLoading()) {
        <p>Cargando issues...</p>
      } @else {
        <p>No hay issues.</p>
      }
    }
  </div>

  <!-- labels -->
  <div>
    @if (labelsQuery.isLoading()) {
      <p>Cargando labels...</p>
    } @else {
      <issues-labels-selector [labels]="labelsQuery.data() ?? []" />
    }
  </div>
</section>
