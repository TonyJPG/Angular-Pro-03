<h1>
  Issue: <small>{{ issueNumber() }}</small>
</h1>

<a [routerLink]="['/issues']">Volver</a>
@if (issueQuery.data() === undefined) {
  <p>Cargando issue...</p>
} @else {
  <issue-comment [issue]="issueQuery.data()!"></issue-comment>
}

<!-- comentarios -->
@for (comment of issueCommentsQuery.data(); track comment.id) {
  <issue-comment [issue]="comment"></issue-comment>
} @empty {
  @if (issueCommentsQuery.isLoading()) {
    <p>Cargando comentarios...</p>
  } @else {
    <p>No hay comentarios.</p>
  }
}
